<!DOCTYPE html>
<!--
  Fixture: one complete notebook frame, so the whole export pipeline can run
  offline against real DOM.

  Built from the structures observed in dumps/20260927/ (STEP 2 and STEP 4) and
  de-identified. It deliberately bundles what the other fixtures keep separate -
  section list, page list and page content in one document - because that is the
  shape `exportContent()` actually receives: a content frame with all three in it.

  Everything here is inert and offline:
    - the image is a data: URL, so it downloads without a network request;
    - the attachment link points at a host that is never contacted, so the download
      attempt fails fast and the Markdown still has to reference it correctly;
    - there are no real credentials, tenant names or note content.
-->
<html lang="en">
<head><meta charset="utf-8"><title>notebook frame fixture</title>
<style>
  /*
    Real dimensions, because two things depend on them:
      - getSections() drops elements whose offsetWidth/offsetHeight are both zero,
        so a zero-size fixture would silently yield no sections at all;
      - selectSection()/selectPage() call Playwright's click(), which enforces
        actionability and refuses to click an element that is not visible.
    The real OneNote UI lays these out, so the fixture must too.
  */
  .sectionListItem, .pageListItem { display: block; width: 320px; height: 26px; }
  .navItem { display: block; width: 300px; height: 22px; }
  .sectionList, .pageList { display: block; width: 340px; }
</style>
</head>
<body>

  <!-- ===== the section tree, as getSections() reads it ===== -->
  <div class="sectionList">
    <div id="11111111-1111-4111-8111-111111111111"
         class="sectionListItem mainItem__item___AAAA" draggable="true">
      <div class="navItem navItem__item____EEEE sectionItem" role="treeitem"
           aria-label="Section One, Section. Selected. Press Tab to navigate to page list of the section."
           aria-selected="true" data-tip="Section One" tabindex="0" data-selection-index="0">
        <div class="mainItem__itemWrap___GGGG">
          <div class="colorBlock__colorBlock___HHHH"><img alt="tabIcon" class="colorBlock__tab___IIII" src="data:image/gif;base64,R0lGOD"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== the page list, as getPages() reads it ===== -->
  <div id="PageList" class="pageList">
    <div class="pageNode" id="{aaaaaaaa-1111-4111-8111-111111111111}{1}">
      <div class="pageListItem mainItem__item___AAAA" draggable="true">
        <div class="navItem navItem__item____EEEE pageItem" role="button"
             aria-label="The Page, page 1 of 1, Page. Selected. Press Ctrl + F6 to navigate to page contents."
             aria-selected="true" data-tip="The Page" tabindex="0" data-selection-index="0">
          <div class="mainItem__itemWrap___GGGG"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== the page canvas, as getPageContent() reads it ===== -->
  <div id="OreoCanvas" class="canvasContainer">

    <div class="OutlineContainer">
      <div class="TitleOutline">The Page</div>
    </div>

    <div class="OutlineContainer">
      <div class="TitleDateTimeOutline">2026-01-02 03:04</div>
    </div>

    <div class="OutlineContainer">
      <p>Hello from the fixture.</p>
      <!--
        A data: URL keeps this offline. The scraper's isRealImage test accepts it
        because the element is larger than the 10px icon threshold, and
        downloadResource writes a base64 data: URL straight to disk.
      -->
      <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
           alt="a one pixel png" style="width:120px;height:120px">
    </div>

    <div class="OutlineContainer">
      <table>
        <tr><th>Header</th><th>Second</th></tr>
        <!-- The pipe inside this cell is the F-25 regression case. -->
        <tr><td>a | b</td><td>plain</td></tr>
      </table>
    </div>

    <div class="OutlineContainer">
      <!--
        An attachment. The download will fail (nothing is listening at that host),
        which is realistic and free; what matters here is that the Markdown still
        references the planned file name.
      -->
      <a href="https://files.example.invalid/docs/report.docx" class="attachment" title="report.docx">report.docx</a>
    </div>

    <div class="OutlineContainer">
      <!-- An internal link whose target is not in this fixture, so it stays unresolved. -->
      <a href="onenote:Fixture.one#Target%20Page&section-id={00000000-0000-0000-0000-000000000000}&end">Target Page</a>
    </div>

  </div>
</body>
</html>

name: Publish Package

# Publishes to npm when a version tag is pushed, and only then. Tagging is the
# release: a branch push can never publish, and a tag whose name disagrees with
# package.json is refused below rather than published under a misleading version.
#
# The GitHub Release for the tag is created here as well, and last. Publishing
# and releasing are two different objects and only the first was automated: seven
# tags reached npm between v0.2.1 and v0.3.7 while this repository had no Release
# at all, so the Releases panel - the one place a reader can go to find out what
# shipped - listed nothing. Nothing has to remember to make the Release now; the
# tag is the event, and the event is this workflow.
#
# This mirrors ../microsoft-webauth's npm-publish.yml, with three differences
# that this repository needs and that are marked in place.
on:
  push:
    tags:
      - 'v*'

# OIDC trusted publishing: npm mints a short-lived credential for this run and
# checks it against the trusted publisher configured on npmjs.com. There is no
# long-lived npm token stored in this repository, so there is nothing to leak,
# rotate or revoke.
#
# Publishing to the public registry is irreversible, so two tags pushed in quick
# succession must not race each other. `cancel-in-progress: false` serialises them
# rather than abandoning a half-finished publish.
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  id-token: write # Required for OIDC trusted publishing
  # write, not read: the Release step at the end of this job creates a Release,
  # which is a contents write. Left at read, that step fails on a permissions
  # error and the outcome is worse than before - tags with no Releases behind
  # them *and* a red run explaining why.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The Release step reads its notes out of the tag object, which the
          # default depth-1 fetch does not reliably carry. Fetching everything is
          # cheap here: this job is already paying for a Chromium download.
          fetch-depth: 0

      # Node 24, which is now also what this repository's CI tests on. Trusted
      # publishing requires Node >= 22.14.0 and npm >= 11.5.1, and npm 10 (what
      # Node 20 ships) has no OIDC support at all - the publish would fail with
      # an authentication error that looks nothing like a version problem. The
      # floor was previously higher than CI's, so the publish ran on a Node the
      # suite never saw.
      # Provenance is still generated either way, since npm attaches it to every
      # trusted publish.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false # never use caching in release builds

      # A mis-tagged release would publish the wrong version under a misleading
      # tag name, and the mistake is only visible after it is on the registry.
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Publishing ${PKG_VERSION} from tag ${GITHUB_REF_NAME}"
        shell: bash

      - run: npm ci

      # The browser-backed tests skip themselves when Chromium is missing, which
      # is right for a developer machine and wrong for a release: the suite would
      # go green having tested less, and nothing would say so. Installing the same
      # browser CI uses keeps the published artefact gated on the same coverage.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build --if-present

      # Lint and test, both of which the CI workflow treats as gates. A tag can be
      # pushed without CI having run on it, so the gates are repeated here rather
      # than assumed.
      - run: npm run lint
      - run: npm test

      # Once npm publishes, the tarball is immutable and public forever. A
      # release must not depend on `files` in package.json staying complete, so
      # the real tarball is inspected rather than the declared file list:
      # test/publishedFiles.test.js checks the same things, but it derives the
      # list from package.json and would agree with a mistake in it.
      - name: Verify the tarball ships no credentials or test material
        # A real file, not a `node -e` string, and that is the whole point.
        #
        # It was a string, and it had never run: a `#` comment inside the array
        # literal - where every other entry used `//` - is not valid JavaScript,
        # so the step died with "Expected ',', got 'ident'" before looking at a
        # single file. The line went in with ffa633b (2026-10-03) and v0.3.7
        # published on 2026-10-01, so v0.4.0 was the first release this gate ever
        # ran on. Inline JavaScript inside YAML is not linted, not imported by
        # anything, and not run until the one moment it cannot be fixed cheaply.
        #
        # scripts/verify-tarball.js is linted, unit-tested by
        # test/verifyTarball.test.js against planted paths, and runnable locally:
        #
        #     node scripts/verify-tarball.js
        #
        # It also refuses a report it cannot read, rather than treating an empty
        # file list as a clean tarball - which is how a check becomes decorative.
        run: node scripts/verify-tarball.js
        shell: bash

      # --access public: this is a scoped package, and npm defaults scoped
      # packages to restricted. --provenance is automatic for a trusted publish;
      # it is stated so the guarantee is visible in this file.
      - run: npm publish --access public --provenance

      # Last, deliberately: a failed build must not leave a Release behind
      # advertising a version that never reached the registry. It is ordered the
      # same way as the tag/version check above, which also refuses before
      # anything is published.
      #
      # GITHUB_TOKEN is enough and needs no secret. The cost is that a Release
      # created this way will not itself trigger workflows on the `release`
      # event, and this repository has none.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run of this workflow must not fail on the Release it made the
          # first time round, and re-runs are exactly when someone is already
          # debugging something else. Checked before the notes are read, so a
          # re-run cannot fail on reading a tag it has no use for.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists, leaving it untouched"
            exit 0
          fi
          NOTES="${RUNNER_TEMP}/release-notes.md"
          # The tag message is already the notes: it is written by hand for every
          # release here, so there is nothing to keep in sync. The script also
          # strips the `commit <sha>` trailer git appends to it, and warns if the
          # tag turns out to be lightweight - in which case the message is a
          # commit subject rather than a changelog, which is worth saying out
          # loud rather than publishing silently.
          node scripts/release-notes.js "${GITHUB_REF_NAME}" > "$NOTES"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "$NOTES"
        shell: bash
